<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etch-a-Cube: Multiplayer</title>
<style>
:root{--sky:#2aa3e3;--sky2:#1b78c9;--cream:#fff6fb;--ink:#2b2233;--pink:#ff3ea5;--orange:#f7931e;--yellow:#ffd23f;--green:#3ec96b;
--pix:'Helvetica Neue',Helvetica,Arial,sans-serif;--hand:'Helvetica Neue',Helvetica,Arial,sans-serif;--mark:'Helvetica Neue',Helvetica,Arial,sans-serif}
:root{--wall:radial-gradient(ellipse at 50% 22%,#ff9bd0,#ff3ea5 75%)}
body[data-theme=night]{--sky:#5a3fc0;--sky2:#170f45;--wall:radial-gradient(ellipse at 50% 22%,#4a1a3f,#0f0912 75%)}
html,body{height:100%;margin:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--wall);color:var(--ink);font-family:var(--hand);font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:0}
#confetti span{position:absolute;opacity:.85;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pix{font-family:var(--pix);font-weight:700;text-transform:uppercase}
.marker{font-family:var(--mark);font-weight:700}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:14px;box-shadow:0 0 0 5px #fff,7px 7px 0 5px var(--ink);touch-action:pan-y}
kbd{display:inline-block;background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:5px;padding:0 .35rem;margin:0 .1rem;font:700 .75em var(--pix)}

.scene{width:200px;height:200px;perspective:800px;cursor:grab;position:relative;z-index:1}
.scene:active{cursor:grabbing}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
.cube.dragging{transition:none}
.face{position:absolute;width:200px;height:200px;box-sizing:border-box;border:4px solid var(--ink);background:radial-gradient(rgba(43,34,51,.14) 1px,transparent 1.6px) 0 0/10px 10px,var(--cream)}
.face.active{box-shadow:inset 0 0 0 5px var(--pink)}
.face canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.front{transform:translateZ(100px)}.back{transform:rotateY(180deg) translateZ(100px)}
.right{transform:rotateY(90deg) translateZ(100px)}.left{transform:rotateY(-90deg) translateZ(100px)}
.top{transform:rotateX(90deg) translateZ(100px)}.bottom{transform:rotateX(-90deg) translateZ(100px)}

.hud{position:relative;z-index:1;margin-top:1.1rem;padding:.55rem .8rem;width:min(340px,calc(100vw - 2rem));box-sizing:border-box;text-align:center;line-height:1.3}
.top-row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.25rem}
.timer.warn{color:#e11d48}
.barwrap{display:flex;align-items:center;gap:.4rem;margin:.3rem 0}
.heart{color:#e11d48;font-size:1.1rem}
.bar{flex:1;height:12px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--pink);transition:width .15s}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:middle;border:2px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem .4rem}
.chip{display:flex;align-items:center;gap:.25rem;padding:.1rem .3rem;border-radius:8px;font-size:.85rem}
.chip .pct{min-width:2.9em;text-align:left;font-variant-numeric:tabular-nums}
.chip.current{background:var(--yellow);box-shadow:0 0 0 2px var(--ink)}
.chip.target{outline:2px dashed var(--pink);outline-offset:2px}

.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(20,15,50,.6)}
.modal .card{width:min(360px,calc(100vw - 2rem));max-height:88vh;overflow:auto;box-sizing:border-box;padding:1rem 1.1rem;text-align:center}
.logo{font-size:2.9rem;line-height:.95;background:linear-gradient(#fff 0,#ffb3dd 40%,#ff3ea5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink));margin:.4rem 0 .8rem}
.tag{display:inline-block;background:var(--ink);color:var(--pink);font-size:.75rem;padding:.35rem .6rem;border-radius:6px;animation:blink 1.2s steps(2) infinite}
.splat{display:inline-block;background:var(--orange);color:#fff;font-size:1.7rem;line-height:1;padding:.5rem 1.2rem;border:3px solid var(--ink);border-radius:46% 54% 52% 48%/56% 44% 56% 44%;transform:rotate(-4deg);text-shadow:2px 2px 0 var(--ink);margin-bottom:.5rem}
.modal h2{margin:.2rem 0 .6rem;font-size:1.6rem}
.modal h3{margin:.7rem 0 .15rem;font-size:1.05rem;text-align:left}
.modal p{margin:.1rem 0;text-align:left}
.keys{list-style:none;margin:0;padding:0;text-align:left}
.keys li{padding:.12rem 0}
.small{font-size:.85rem;opacity:.75;text-align:center!important}
.btn,.row{font:700 .9rem var(--pix);text-transform:uppercase;color:var(--ink);border:3px solid var(--ink);border-radius:10px;cursor:pointer;box-shadow:0 4px 0 var(--ink);margin-top:.7rem;padding:.55rem 1rem}
.btn{background:var(--pink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;width:100%;background:#fff;margin-top:.55rem}
.btn:active,.row:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.row:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* gallery */
#confetti{display:none}
#gallery{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.floor{position:absolute;left:0;right:0;bottom:0;height:28%;border-top:6px solid #fff;background:repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,62,165,.45) 78px 80px),linear-gradient(#2b2233,#0f0912)}
body[data-theme=night] .floor{filter:brightness(.4)}
.spot{position:absolute;top:0;left:50%;width:min(600px,100%);height:100%;transform:translateX(-50%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,241,200,.6),rgba(255,241,200,0) 85%)}
body[data-theme=night] .spot{background:linear-gradient(rgba(255,226,150,.4),rgba(255,226,150,0) 85%)}
.lamp{position:absolute;top:0;left:50%;width:34px;height:18px;margin-left:-17px;background:var(--ink);border-radius:0 0 17px 17px}
.frame{position:absolute;box-sizing:border-box;padding:8px;background:#fff;border:5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.frame i{display:block;width:100%;height:100%;background-color:var(--cream)}
.f1{left:9%;top:16%;width:88px;height:116px}
.f1 i{background:linear-gradient(90deg,#ef4444 0 25%,#f97316 0 50%,#22c55e 0 75%,#3b82f6 0)}
.f2{right:8%;top:12%;width:150px;height:104px}
.f2 i{background:radial-gradient(circle at 30% 42%,#a855f7 0 22%,transparent 23%),radial-gradient(circle at 68% 60%,#f97316 0 26%,transparent 27%),var(--cream)}
.f3{left:20%;top:46%;width:58px;height:58px}
.f3 i{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 9px),var(--cream)}
@media (max-width:760px){.frame{display:none}}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.stage .scene{margin-bottom:52px}
.plinth{position:relative;z-index:2;width:210px;height:84px;box-sizing:border-box;background:linear-gradient(90deg,#fff,#ffd6ec);border:4px solid var(--ink);border-top:0;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.plinth::before{content:"";position:absolute;left:-12px;right:-12px;top:-14px;height:14px;box-sizing:border-box;background:#fff;border:4px solid var(--ink);border-radius:4px 4px 0 0}
.plinth::after{content:"";position:absolute;left:50%;top:-12px;width:150px;height:10px;margin-left:-75px;background:radial-gradient(ellipse,rgba(43,34,51,.4),transparent 70%)}
.plinth b{font-size:1rem}.plinth span{font-size:.85rem}
/* multiplayer */
body.mp .frame{display:none}
input{font:inherit;font-size:1rem;width:100%;box-sizing:border-box;margin:.2rem 0 .5rem;padding:.45rem .6rem;border:3px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
label{display:block;text-align:left;font-size:.9rem}
#board{position:fixed;top:.8rem;right:.8rem;z-index:2;width:220px;padding:.5rem .6rem;display:none;box-sizing:border-box;font-size:.9rem}
body.mp #board{display:block}
#board h4{margin:.5rem 0 .2rem;font-size:.75rem}
#board ol{margin:0;padding:0;list-style:none}
#board li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 .4rem;padding:.1rem .3rem}
#board li.me{background:var(--yellow);border-radius:6px}
#board .mini{width:100%;height:5px;background:#fff;border:2px solid var(--ink);border-radius:4px}
#board .mini i{display:block;height:100%;background:var(--pink)}
.btn.sm{margin-top:.4rem;padding:.35rem .6rem;font-size:.75rem;width:100%}
@media (max-width:760px){#board{display:none!important}}
.av{width:26px;height:26px;flex:none;display:inline-block}
.av svg,.avbtn svg{width:100%;height:100%;display:block}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin:.3rem 0 .6rem}
.avbtn{aspect-ratio:1;padding:2px;border:3px solid var(--ink);border-radius:12px;background:#ffe1f0;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.avbtn.sel{background:var(--yellow);outline:3px dashed var(--pink);outline-offset:2px}
.tasks{display:flex;flex-wrap:wrap;gap:.15rem .6rem;justify-content:center;font-size:.85rem}.task.done{opacity:.55;text-decoration:line-through}
.face.want::after{content:"";position:absolute;inset:0;border:5px dashed var(--yellow);z-index:2;pointer-events:none}

/* 3D gallery layer */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;cursor:grab;touch-action:none}
body.gl #gallery,body.gl .stage,body.gl #confetti{display:none}
body.gl .hud{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0}
</style>
</head>
<body data-theme="day">
<div id="gallery"><div class="floor"></div><div class="spot"></div><div class="lamp"></div><div class="frame f1"><i></i></div><div class="frame f2"><i></i></div><div class="frame f3"><i></i></div></div>
<div id="confetti"></div>

<div class="stage">
<div class="scene" id="scene">
  <div class="cube" id="cube">
    <div class="face front" data-face="front"><canvas width="200" height="200"></canvas></div>
    <div class="face back" data-face="back"><canvas width="200" height="200"></canvas></div>
    <div class="face right" data-face="right"><canvas width="200" height="200"></canvas></div>
    <div class="face left" data-face="left"><canvas width="200" height="200"></canvas></div>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div id="board" class="card"><div class="pix" style="font-size:.75rem" id="roomLbl"></div><button class="btn sm" id="startBtn">Start round</button><h4 class="pix">Live race</h4><ol id="live"></ol><h4 class="pix">Finished</h4><ol id="fin"></ol><h4 class="pix">All-time top 10</h4><ol id="alltime"></ol></div>

<script>
const $ = id => document.getElementById(id);
const cube = $('cube'), scene = $('scene'), card = $('modalCard'), modalEl = $('modal');
const timerEl = $('timer'), goalEl = $('goal'), barEl = $('bar');

// confetti backdrop
(() => {
  const bits = ['✦','★','■','▲','✚','●','♥'], cols = ['#ffd23f','#ff5fa8','#3ec96b','#fff','#f7931e','#8be9ff'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.textContent = bits[i % bits.length];
    Object.assign(s.style, { left: Math.random()*100+'%', top: Math.random()*100+'%', color: cols[i % cols.length],
      fontSize: (10 + Math.random()*22)+'px', transform: `rotate(${Math.random()*360}deg)`, animationDelay: (-Math.random()*6)+'s' });
    $('confetti').appendChild(s);
  }
})();

const faceOrder = ['front','right','back','left','top','bottom'];
const faceRotations = { front:{x:0,y:0}, right:{x:0,y:-90}, back:{x:0,y:180}, left:{x:0,y:90}, top:{x:-90,y:0}, bottom:{x:90,y:0} };
const colors = ['#2b2233','#ef4444','#f97316','#22c55e','#3b82f6','#a855f7'];
const colorNames = ['black','red','orange','green','blue','purple'];
let colorIndex = 0, activeFace = 'front', rotX = 0, rotY = 0;

const localNormals = { front:{x:0,y:0,z:1}, back:{x:0,y:0,z:-1}, right:{x:1,y:0,z:0}, left:{x:-1,y:0,z:0}, top:{x:0,y:-1,z:0}, bottom:{x:0,y:1,z:0} };
function faceNormalWorld(face, rx, ry) {
  const d = Math.PI/180, a = rx*d, b = ry*d, n = localNormals[face];
  const x1 = n.x*Math.cos(b) + n.z*Math.sin(b), y1 = n.y, z1 = -n.x*Math.sin(b) + n.z*Math.cos(b);
  return { x: x1, y: y1*Math.cos(a) - z1*Math.sin(a), z: y1*Math.sin(a) + z1*Math.cos(a) };
}
function syncActiveFace() {
  let best = null, bz = -Infinity;
  faceOrder.forEach(f => { const z = faceNormalWorld(f, rotX, rotY).z; if (z > bz) { bz = z; best = f; } });
  if (best !== activeFace) {
    activeFace = best;
    document.querySelectorAll('.face').forEach(el => el.classList.toggle('active', el.dataset.face === best));
  }
}

const STEP = 6, ROT_STEP = 10;
const state = {};
faceOrder.forEach(f => {
  const canvas = document.querySelector(`.face[data-face="${f}"] canvas`);
  state[f] = { ctx: canvas.getContext('2d', { willReadFrequently: true }), x: 100, y: 100 };
});

const legend = $('legend');
colors.forEach((c, i) => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<kbd>${i+1}</kbd><span class="swatch" style="background:${c}"></span><span class="pct">0%</span>`;
  legend.appendChild(chip);
});
const chips = Array.from(legend.children);
const pctEls = chips.map(c => c.querySelector('.pct'));
function updateHud() { chips.forEach((c, i) => c.classList.toggle('current', i === colorIndex)); }

function applyRotation() { cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`; syncActiveFace(); }
function setActiveFace(face) { rotX = faceRotations[face].x; rotY = faceRotations[face].y; cube.classList.remove('dragging'); applyRotation(); }
function cycleFace(dir) { setActiveFace(faceOrder[(faceOrder.indexOf(activeFace) + dir + 6) % 6]); }

// dragging
let dragging = false, lastX = 0, lastY = 0;
const dragStart = (x, y) => { dragging = true; lastX = x; lastY = y; cube.classList.add('dragging'); };
const dragMove = (x, y) => { if (!dragging) return; rotY += (x-lastX)*.4; rotX -= (y-lastY)*.4; lastX = x; lastY = y; applyRotation(); };
const dragEnd = () => { dragging = false; cube.classList.remove('dragging'); };
scene.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
window.addEventListener('mouseup', dragEnd);
scene.addEventListener('touchstart', e => dragStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
window.addEventListener('touchmove', e => dragMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
window.addEventListener('touchend', dragEnd);

// color coverage
const paletteRGB = colors.map(c => [1,3,5].map(i => parseInt(c.slice(i, i+2), 16)));
const TOTAL_PX = 6*200*200;
let statsQueued = false;
function updateStats() {
  statsQueued = false;
  const counts = new Array(6).fill(0), fc = {};
  faceOrder.forEach(f => {
    fc[f] = new Array(6).fill(0);
    const d = state[f].ctx.getImageData(0, 0, 200, 200).data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i+3] < 128) continue;
      let best = 0, bd = Infinity;
      for (let k = 0; k < 6; k++) {
        const p = paletteRGB[k], dist = (d[i]-p[0])**2 + (d[i+1]-p[1])**2 + (d[i+2]-p[2])**2;
        if (dist < bd) { bd = dist; best = k; }
      }
      counts[best]++; fc[f][best]++;
    }
  });
  counts.forEach((n, k) => pctEls[k].textContent = (n/TOTAL_PX*100).toFixed(1) + '%');
  checkGame(counts, fc);
}
function queueStats() { if (!statsQueued) { statsQueued = true; requestAnimationFrame(updateStats); } }

function draw(dx, dy) {
  if (mode !== 'playing') return;
  const s = state[activeFace];
  const nx = Math.min(200, Math.max(0, s.x+dx)), ny = Math.min(200, Math.max(0, s.y+dy));
  s.ctx.strokeStyle = colors[colorIndex]; s.ctx.lineWidth = 5; s.ctx.lineCap = 'round';
  s.ctx.beginPath(); s.ctx.moveTo(s.x, s.y); s.ctx.lineTo(nx, ny); s.ctx.stroke();
  s.x = nx; s.y = ny;
  queueStats();
}
// arrows always move in screen directions (up is up, right is right) whichever face you are on
const CSS_AX = { front: [[1,0,0],[0,1,0]], back: [[-1,0,0],[0,1,0]], right: [[0,0,-1],[0,1,0]], left: [[0,0,1],[0,1,0]], top: [[1,0,0],[0,0,1]], bottom: [[1,0,0],[0,0,-1]] };
function screenOf(n) {
  const d = Math.PI/180, a = rotX*d, b = rotY*d;
  const x1 = n[0]*Math.cos(b) + n[2]*Math.sin(b), z1 = -n[0]*Math.sin(b) + n[2]*Math.cos(b);
  return [x1, n[1]*Math.cos(a) - z1*Math.sin(a)];
}
function drawDir(dx, dy) {
  if (window.glMapped) return draw(dx, dy); // the 3D gallery does its own mapping
  const [u, v] = CSS_AX[activeFace].map(screenOf);
  const cx = u[0]*dx + u[1]*dy, cy = v[0]*dx + v[1]*dy, n = Math.hypot(dx, dy);
  return Math.abs(cx) >= Math.abs(cy) ? draw(Math.sign(cx) * n, 0) : draw(0, Math.sign(cy) * n);
}
function clearFace(face) { const s = state[face]; s.ctx.clearRect(0, 0, 200, 200); s.x = 100; s.y = 100; queueStats(); }

// ---------- game ----------
const settings = { diff: 'normal', theme: 'day' };
const DIFF = { easy:{p:.7,t:1.3,s:.5}, normal:{p:1,t:1,s:1}, hard:{p:1.3,t:.8,s:1.5} };
let mode = 'idle'; // idle | playing | paused | between | over
let level = 1, score = 0, goal = null, endAt = 0, tickId = null, timeLeft = 0, curPct = 0, pausedLeft = 0;

const fmt = t => { t = Math.max(0, Math.ceil(t)); return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); };
function pickFaces(k) { const pool = faceOrder.slice(), out = []; while (out.length < k) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]); return out; }
const TASK_PCT = 11; // % of a face to cover, per task (same as the old level 1)
function makeTasks(n, pct) {
  const fs = pickFaces(Math.min(1 + Math.floor((n - 1) / 2), 6)), cs = pickN([0,1,2,3,4,5], Math.min(1 + Math.floor((n - 1) / 2), 6)); // a new task every 2 levels
  return fs.map((f, i) => ({ face: f, color: cs[i], pct }));
}
function pickN(arr, k) { const p = arr.slice(), o = []; while (o.length < k) o.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]); return o; }
function mkGoal(tasks, secs) { return { tasks, secs, pct: 100, color: tasks[0].color, faces: tasks.map(t => t.face) }; }
function goalWhere(g) { return g.faces ? g.faces.join(' + ') + (g.faces.length > 1 ? ' faces' : ' face') : 'whole cube'; }
function markFaces() { document.querySelectorAll('.face').forEach(el => el.classList.toggle('want', !!(goal && goal.tasks.some(t => t.face === el.dataset.face && !t.done)))); }
function renderGoal() {
  markFaces();
  $('lvl').textContent = level; $('score').textContent = score;
  chips.forEach((c, i) => c.classList.toggle('target', !!goal && goal.tasks.some(t => t.color === i)));
  if (!goal) { goalEl.textContent = mp.on ? 'Waiting for a round…' : 'Press start to play!'; barEl.style.width = '0'; timerEl.textContent = '--:--'; return; }

const art = [
  (c, w, h) => ['#ef4444', '#f97316', '#22c55e', '#3b82f6'].forEach((k, i) => { c.fillStyle = k; c.fillRect(i * w / 4, 0, w / 4, h); }),
  (c, w, h) => { c.fillStyle = '#fff6fb'; c.fillRect(0, 0, w, h); [['#a855f7', .3, .42, .22], ['#f97316', .68, .6, .26]].forEach(([k, x, y, r]) => { c.fillStyle = k; c.beginPath(); c.arc(x * w, y * h, r * w, 0, 7); c.fill(); }); },
  (c, w, h) => { c.fillStyle = '#fff6fb'; c.fillRect(0, 0, w, h); c.strokeStyle = '#2b2233'; c.lineWidth = 3; for (let i = -h; i < w; i += 16) { c.beginPath(); c.moveTo(i, h); c.lineTo(i + h, 0); c.stroke(); } },
  (c, w, h) => { for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { c.fillStyle = (x + y) % 2 ? '#ffd23f' : '#ff3ea5'; c.fillRect(x * w / 8, y * h / 8, w / 8 + 1, h / 8 + 1); } },
  (c, w, h) => { c.fillStyle = '#2b2233'; c.fillRect(0, 0, w, h); ['#ffd23f', '#ff3ea5', '#3ec96b', '#fff6fb'].forEach((k, i) => { c.fillStyle = k; c.beginPath(); c.arc(w / 2, h / 2, w * .42 - i * w * .1, 0, 7); c.fill(); }); }
];
[[-3.8, -5.97, 0, 1.5, 2, 0], [3.6, -5.97, 0, 2.4, 1.6, 1], [-6.97, -2, Math.PI / 2, 1.6, 1.6, 2],
 [-6.97, 2.2, Math.PI / 2, 1, 1.4, 3], [6.97, -1.5, -Math.PI / 2, 1.8, 1.4, 4], [6.97, 2.5, -Math.PI / 2, 1.2, 1.2, 2]].forEach(([x, z, r, w, h, a]) => {
  const g = new T.Group(); g.position.set(x, 2.5, z); g.rotation.y = r;
  const box = (bw, bh, col, pz) => { const m = new T.Mesh(new T.BoxGeometry(bw, bh, .06), Std({ color: col, roughness: .8 })); m.position.z = pz; g.add(m); };
  box(w + .3, h + .3, INK, 0); box(w + .16, h + .16, 0xffffff, .02);
  const p = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshLambertMaterial({ map: mk(256, Math.round(256 * h / w), art[a]) })); p.position.z = .055; g.add(p); S.add(g); });

// plinth, plaque, spotlight
const plinth = new T.Mesh(new T.BoxGeometry(1.5, .9, 1.5), Std({ color: 0xffe1f0, roughness: .6 })); plinth.position.y = .45; plinth.castShadow = plinth.receiveShadow = true; S.add(plinth);
const cap = new T.Mesh(new T.BoxGeometry(1.7, .1, 1.7), Std({ color: 0xffffff, roughness: .5 })); cap.position.y = .95; cap.receiveShadow = true; S.add(cap);
[plinth, cap].forEach(m => m.add(new T.LineSegments(new T.EdgesGeometry(m.geometry), new T.LineBasicMaterial({ color: INK }))));
const plaque = new T.Mesh(new T.PlaneGeometry(1, .35), new T.MeshBasicMaterial({ map: mk(256, 90, (c, w, h) => {
  c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.fillStyle = '#2b2233'; c.textAlign = 'center';
  c.font = 'bold 30px Helvetica,Arial,sans-serif'; c.fillText('ETCH-A-CUBE', w / 2, 42); c.font = '20px Helvetica,Arial,sans-serif'; c.fillText('felt tip on six faces', w / 2, 72); }) }));
plaque.position.set(0, .45, .76); S.add(plaque);
const hemi = new T.HemisphereLight(0xffffff, 0xff9bd0, .6); S.add(hemi);
const spot = new T.SpotLight(0xfff1c8, 2.4, 14, .5, .5, 1); spot.position.set(0, 4.8, .3); spot.target.position.set(0, 1.6, 0);
spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); S.add(spot, spot.target);
const lamp = new T.Mesh(new T.CylinderGeometry(.12, .2, .3, 20), Std({ color: INK })); lamp.position.y = 4.85; S.add(lamp);
const cone = new T.Mesh(new T.ConeGeometry(1.9, 4.8, 32, 1, true), new T.MeshBasicMaterial({ color: 0xfff1c8, transparent: true, opacity: .09, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending }));
cone.position.y = 2.4; S.add(cone);

// the cube: each face is the live game canvas, composited onto paper
const order = ['right', 'left', 'top', 'bottom', 'front', 'back'];
const paper = document.createElement('canvas'); paper.width = paper.height = 200;
{ const c = paper.getContext('2d'); c.fillStyle = '#fff6fb'; c.fillRect(0, 0, 200, 200); c.fillStyle = 'rgba(43,34,51,.14)'; for (let y = 0; y < 200; y += 10) for (let x = 0; x < 200; x += 10) c.fillRect(x, y, 1.6, 1.6); }
const F = order.map(f => {
  const el = document.querySelector(`.face[data-face="${f}"]`), cv = document.createElement('canvas'); cv.width = cv.height = 200;
  const tex = new T.CanvasTexture(cv); tex.generateMinFilter = false; tex.generateMipmaps = false; tex.minFilter = T.LinearFilter; tex.anisotropy = 4;
  return { el, cv, ctx: cv.getContext('2d'), src: el.querySelector('canvas'), tex };
});
const cube = new T.Mesh(new T.BoxGeometry(1.1, 1.1, 1.1), F.map(f => Std({ map: f.tex, emissive: 0xffffff, emissiveMap: f.tex, emissiveIntensity: .35, roughness: .6 })));
cube.castShadow = true; S.add(cube);
function paintFaces() {
  F.forEach(f => { const c = f.ctx; c.setLineDash([]); c.drawImage(paper, 0, 0); c.drawImage(f.src, 0, 0);
    c.strokeStyle = '#2b2233'; c.lineWidth = 8; c.strokeRect(0, 0, 200, 200);
    if (f.el.classList.contains('active')) { c.strokeStyle = '#ff3ea5'; c.lineWidth = 10; c.strokeRect(9, 9, 182, 182); }
    if (f.el.classList.contains('want')) { c.strokeStyle = '#ffd23f'; c.lineWidth = 10; c.setLineDash([16, 10]); c.strokeRect(9, 9, 182, 182); }
    f.tex.needsUpdate = true; });
}

// input: drag rotates the cube (uses the game's own drag handlers), wheel dollies, pointer adds parallax
R.domElement.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
R.domElement.addEventListener('touchstart', e => dragStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
let px = 0, py = 0, dist = 5.2;
addEventListener('mousemove', e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; });
R.domElement.addEventListener('wheel', e => { dist = Math.min(7.5, Math.max(3.2, dist + e.deltaY * .003)); e.preventDefault(); }, { passive: false });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function size() { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();

let night = null;
function theme() {
  const n = body.dataset.theme === 'night'; if (n === night) return; night = n;
  wallMat.color.set(n ? 0x2a0f26 : 0xff6fbb); hemi.intensity = n ? .18 : .6; spot.intensity = n ? 3 : 2.4; cone.material.opacity = n ? .14 : .09;
}
// hover: the pen follows the face under the mouse. Arrows always move in screen directions (up is up, right is right) whichever face is drawn on
const AX = { front: [[1, 0, 0], [0, -1, 0]], back: [[-1, 0, 0], [0, -1, 0]], right: [[0, 0, -1], [0, -1, 0]], left: [[0, 0, 1], [0, -1, 0]], top: [[1, 0, 0], [0, 0, 1]], bottom: [[1, 0, 0], [0, 0, -1]] };
const ray = new T.Raycaster(), mouse = new T.Vector2(), V = a => new T.Vector3(...a);
let hover = null, mouseIn = false;
addEventListener('mousemove', e => { mouseIn = e.target === R.domElement; mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); });
document.addEventListener('mouseleave', () => { mouseIn = false; });
function updateHover() {
  if (dragging) return;
  let f = null;
  if (mouseIn && !modal) { ray.setFromCamera(mouse, cam); const h = ray.intersectObject(cube)[0]; if (h) f = order[h.face.materialIndex]; }
  if (f !== hover) { hover = f; R.domElement.style.cursor = f ? 'crosshair' : 'grab'; if (!f) syncActiveFace(); }
  if (hover && activeFace !== hover) { activeFace = hover; document.querySelectorAll('.face').forEach(el => el.classList.toggle('active', el.dataset.face === hover)); }
}
const _draw = draw;
draw = function (dx, dy) {
  const [u, v] = AX[hover || activeFace].map(a => V(a).applyQuaternion(cube.quaternion));
  const w = V([1, 0, 0]).applyQuaternion(cam.quaternion).multiplyScalar(dx).addScaledVector(V([0, -1, 0]).applyQuaternion(cam.quaternion), dy);
  const cx = w.dot(u), cy = w.dot(v), n = Math.hypot(dx, dy);
  return Math.abs(cx) >= Math.abs(cy) ? _draw(Math.sign(cx) * n, 0) : _draw(0, Math.sign(cy) * n);
};

const clock = new T.Clock();
(function loop() {
  requestAnimationFrame(loop); theme(); paintFaces();
  const t = clock.getElapsedTime(), k = dragging ? 1 : .18;   // CSS rotate (y down) -> three (y up): flip X
  cube.rotation.x += (-rotX * D - cube.rotation.x) * k; cube.rotation.y += (rotY * D - cube.rotation.y) * k;
  cube.position.y = 1.8 + (still ? 0 : Math.sin(t * 1.2) * .04);
  const m = innerWidth < innerHeight ? 1 + (1 - innerWidth / innerHeight) * .9 : 1;
  cam.position.x += (px * 1.6 - cam.position.x) * .05; cam.position.y += (1.75 - py * .5 - cam.position.y) * .05; cam.position.z = dist * m;
  cam.lookAt(0, 1.3, 0); cam.updateMatrixWorld(); updateHover(); R.render(S, cam);
})();
})();
</script>
